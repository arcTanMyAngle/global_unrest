[package]
name = "workers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# M4: scheduled ingest worker. Owns its own DuckDB (never shared with the
# desktop or services/api) and publishes immutable date-partitioned Parquet
# snapshots — the cross-process handoff surface (docs/API.md).

# ACLED live ingestion (M5): off by default. Snapshots produced with this
# feature contain ACLED-derived rows — local/authorized use only, never
# publicly redistributed (docs/SAFETY_AND_PRIVACY.md).
[features]
acled-live = ["dep:source-acled", "source-acled/live"]
# NOAA/NWS active alerts (M5 optional layer): keyless, US coverage.
noaa-live = ["dep:source-noaa", "source-noaa/live"]
# IODA internet-outage events (optional layer, keyless): country-precision.
ioda-live = ["dep:source-ioda", "source-ioda/live"]
# Bluesky Jetstream chatter volume (optional layer, keyless): aggregate-only,
# never individual posts (docs/SAFETY_AND_PRIVACY.md).
bluesky-live = ["dep:source-bluesky", "source-bluesky/live"]
# Telegram public-channel chatter volume (optional layer): aggregate-only,
# same posture as Bluesky. Needs a one-time interactive login (see
# crates/source-telegram/examples/login_setup.rs) before it activates.
telegram-live = ["dep:source-telegram", "source-telegram/live"]
# GKG 2.1 story-location attention (M9.1): opt-in, off by default. Adds the
# GKG ingest leg on top of the always-on DOC + Events legs.
gkg-live = []

[dependencies]
# Only used by examples/gen_api_test_fixture.rs, to compute a real H3 cell
# for its hand-crafted test events (geo_utils::cell_for_latlon) — not used
# by the worker binary itself.
geo-utils.workspace = true
source-acled = { workspace = true, optional = true }
source-bluesky = { workspace = true, optional = true }
source-ioda = { workspace = true, optional = true }
source-noaa = { workspace = true, optional = true }
source-telegram = { workspace = true, optional = true }
anyhow.workspace = true
chrono.workspace = true
core-types.workspace = true
directories.workspace = true
source-fixtures.workspace = true
source-gdelt.workspace = true
storage.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
