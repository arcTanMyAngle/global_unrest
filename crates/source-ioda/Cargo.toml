[package]
name = "source-ioda"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# IODA (Internet Outage Detection and Analysis, Georgia Tech) — keyless
# public API, country-level internet-outage severity signal. The live path
# is feature-gated like source-acled/source-noaa; parsing/normalization
# stay pure and offline-testable.

[features]
default = []
live = ["dep:reqwest"]

[dependencies]
core-types.workspace = true
geo-utils.workspace = true
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }

[lints]
workspace = true
