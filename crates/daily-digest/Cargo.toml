[package]
name = "daily-digest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The "Daily Events" page's interpretive layer: one plain-language digest per
# UTC calendar day, generated by the Anthropic Claude API from aggregated
# facts this project already stores.
#
# Deliberately NOT named `source-*`. In this workspace that prefix is a
# contract — a `source-*` crate implements `core_types::SignalSource` and
# yields `GeoTemporalEvent`s. This crate ingests nothing and produces no
# events; it reads what the other sources already produced and writes prose.
# It still follows every source-crate convention that applies: pure,
# offline-testable `lib.rs`; the only network code behind the `live` feature
# in `live.rs`; credentials from env vars only; a mock-server test suite.

[features]
default = []
live = ["dep:reqwest"]

[dependencies]
core-types.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
