[package]
name = "source-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Telegram (public channels, aggregate chatter volume) — third real-time
# source after IODA and Bluesky, reusing `chatter` unchanged. Poll-based
# (not streaming, unlike Bluesky): each cycle sweeps a small curated channel
# allowlist via MTProto and drains completed chatter windows.
#
# The ingest path is aggregate-only by construction, same as `source-bluesky`:
# nothing on it may ever return message text or author identity to a caller
# (docs/SAFETY_AND_PRIVACY.md hard rule 6). `src/media.rs` is the one
# user-directed exception — an on-demand, nothing-stored lookup that reuses
# this crate's session. Read that module's docs before touching it.

[features]
default = []
live = [
    "dep:tokio",
    "dep:grammers-client",
    "dep:grammers-session",
    "dep:grammers-mtsender",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
chatter.workspace = true
chrono.workspace = true
core-types.workspace = true
# Not optional: `src/media.rs` is the pure half of the on-demand lookup and is
# unit-tested without the `live` feature. The arrow only points this way —
# `media-search` must never depend on this crate, or the graph cycles.
media-search.workspace = true
tracing.workspace = true
grammers-client = { workspace = true, optional = true }
grammers-mtsender = { workspace = true, optional = true }
# Pulled with `default-features = false` at the workspace root, which drops
# `sqlite-storage` (and its duplicate vendored SQLite) — `src/file_session.rs`
# replaces it, and serde supplies that file's derives.
grammers-session = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# `login_setup` (one-time interactive login) only.
dotenvy.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
