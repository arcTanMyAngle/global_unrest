[workspace]
resolver = "3"
members = [
    "apps/global-signal-desktop",
    "crates/analytics",
    "crates/chatter",
    "crates/core-types",
    "crates/daily-digest",
    "crates/geo-utils",
    "crates/media-search",
    "crates/renderer",
    "crates/source-acled",
    "crates/source-bluesky",
    "crates/source-fixtures",
    "crates/source-gdelt",
    "crates/source-ioda",
    "crates/source-noaa",
    "crates/source-telegram",
    "crates/storage",
    "services/api",
    "services/workers",
]

[workspace.package]
# Version is milestone-tied (0.<milestone>.0), not SemVer — see
# CHANGELOG.md and docs/ROADMAP.md's M6 version-bump policy.
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
# None of these crates/binaries are meant for crates.io — internal-only
# workspace members. Also lets cargo-deny's allow-wildcard-paths treat our
# unversioned path deps as intentional rather than a publish hazard.
publish = false

[workspace.dependencies]
# Internal crates
analytics = { path = "crates/analytics" }
chatter = { path = "crates/chatter" }
core-types = { path = "crates/core-types" }
daily-digest = { path = "crates/daily-digest" }
geo-utils = { path = "crates/geo-utils" }
media-search = { path = "crates/media-search" }
renderer = { path = "crates/renderer" }
source-acled = { path = "crates/source-acled" }
source-bluesky = { path = "crates/source-bluesky" }
source-fixtures = { path = "crates/source-fixtures" }
source-gdelt = { path = "crates/source-gdelt" }
source-ioda = { path = "crates/source-ioda" }
source-noaa = { path = "crates/source-noaa" }
source-telegram = { path = "crates/source-telegram" }
storage = { path = "crates/storage" }

# External crates — pinned at the workspace level; do not re-declare versions
# in member crates. eframe 0.35 rides wgpu 29; do not bump wgpu independently.
anyhow = "1"
# M4/M7 services/api only.
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
criterion = "0.7"
directories = "6"
dotenvy = "0.15"
duckdb = { version = "1.10504.0", features = ["bundled"] }
earcutr = "0.5"
eframe = "0.35"
egui = "0.35"
# Selects `zip`'s DEFLATE backend: flate2's default rust_backend (miniz_oxide,
# pure Rust). `zip`'s deflate-flate2 feature pulls flate2 but not a backend.
flate2 = "1"
# Bluesky Jetstream's WebSocket stream. futures-util supplies the StreamExt
# the socket is polled through.
futures-util = { version = "0.3", default-features = false }
geo = "0.33"
geojson = "1.0"
governor = "0.10"
# Telegram MTProto (source-telegram, feature `live`): pure-Rust client, no
# TDLib/C++ dependency — keeps this workspace's "no bundled C++ beyond
# DuckDB" posture. All grammers-* crates are one workspace and version
# together upstream.
grammers-client = "0.10"
# `default-features = false` drops `sqlite-storage`, whose `libsql-ffi`
# vendors a second static SQLite alongside the one `rusqlite`/`libsqlite3-sys`
# already vendors — linking both into one binary fails with duplicate
# `sqlite3_*` symbols (LNK2005). `cargo check`/`clippy` never link, so only a
# real `cargo build` catches it. `source-telegram::file_session` replaces the
# dropped storage; `serde` supplies the derives its mirror struct needs.
# Must be set here, not in the member: Cargo ignores a member's
# `default-features = false` when the workspace entry leaves defaults on.
grammers-session = { version = "0.10", default-features = false, features = [
    "serde",
] }
grammers-mtsender = "0.10"
h3o = "0.10"
# GDELT live ingestion (M3). rustls (not native-tls) so CI stays OpenSSL-free
# on both Windows and Linux; no default TLS/http2 pulled in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# tokio-tungstenite's rustls feature pulls rustls but selects no crypto
# provider, so source-bluesky installs one explicitly. `ring` is the provider
# reqwest already puts in this tree; default features off keeps aws-lc-rs
# (and its cmake/NASM build requirement) out of CI.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# GDELT Events dumps are single-entry DEFLATE zips; pure-Rust miniz_oxide
# backend keeps CI OpenSSL/zlib-free. No aes/bzip2/lzma/zstd.
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
# "net" gives the current-thread runtime its IO driver (reqwest needs it for
# the live GDELT ingest loop); "rt" only, no multi-thread.
tokio = { version = "1.52", features = ["rt", "macros", "sync", "time", "net"] }
# Bluesky Jetstream (streaming source). rustls + webpki-roots so it rides the
# same TLS stack as reqwest and CI stays OpenSSL-free; `connect` already
# implies handshake/stream.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# In-app video playback (desktop only, feature `video-embed`). This is the
# only way to play a *page* URL — YouTube/Vimeo/Rumble/Bluesky all serve
# video through a player page, and extracting the underlying stream would be
# scraping. wry parents a platform webview (WebView2 on Windows, preinstalled
# on Win11) as a child of the eframe window; see apps/global-signal-desktop/
# src/video.rs for the airspace caveat. Declared here for the pin only — the
# member declares it under `[target.'cfg(windows)'.dependencies]`, because on
# Linux wry needs webkit2gtk-4.1 dev packages that CI's ubuntu leg has not
# got. `default-features = false` drops the Linux/GTK backend and the drag-drop
# and devtools extras; `protocol` is kept on and is not optional — it is what
# serves the player page from a real `http://` origin, without which YouTube's
# embed refuses to start ("Error 153"). See apps/global-signal-desktop/
# src/video.rs. The feature adds no dependencies of its own.
wry = { version = "0.55", default-features = false, features = ["protocol"] }
# M7 services/api hardening. tower supplies ServiceBuilder ("util") and the
# concurrency cap ("limit"); tower-http supplies request tracing, CORS,
# response compression, and a timeout layer that needs no extra crypto/TLS
# stack (pure middleware, unlike reqwest/tokio-tungstenite's TLS deps above).
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = [
    "trace",
    "cors",
    "compression-gzip",
    "timeout",
] }
# Per-IP token-bucket rate limiting. Registry package name is `tower_governor`
# (underscore) despite the project's own docs/crates.io listing it as
# "tower-governor" — `cargo add`/the registry index reject the hyphenated
# form. `default-features = false` drops the `tonic` (gRPC) feature this
# crate defaults on — the api is HTTP-only, no gRPC in this tree. Reuses the
# `governor` crate already pinned above for source-gdelt's fetch-rate
# limiter.
tower_governor = { version = "0.8", default-features = false, features = [
    "axum",
] }
# OpenAPI spec generation for the api (M7 item 4).
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
# Prometheus /metrics (M7 item 3). `default-features = false` drops
# `http-listener`/`push-gateway` — the exporter renders text that our own
# axum `/metrics` route returns, so we don't need this crate's built-in
# hyper server, and `push-gateway`'s `hyper-rustls/aws-lc-rs` would pull in
# the cmake/NASM-requiring TLS backend the `rustls` pin above deliberately
# avoids for the whole workspace.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies even in dev builds: epaint tessellation and geo math
# stay smooth while the workspace crates keep fast incremental compiles.
[profile.dev.package."*"]
opt-level = 2
