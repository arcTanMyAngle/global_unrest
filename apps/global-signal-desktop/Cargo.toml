[package]
name = "global-signal-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The user-facing desktop is live-only, so its authorized/keyless live source
# adapters are included by default. Credentials remain runtime env vars.
[features]
default = [
    "acled-live",
    "noaa-live",
    "ioda-live",
    "bluesky-live",
    "telegram-live",
    "gemini-live",
    "media-live",
    "video-embed",
]
acled-live = ["dep:source-acled", "source-acled/live"]
# NOAA/NWS active alerts (M5 optional layer): keyless, US coverage.
noaa-live = ["dep:source-noaa", "source-noaa/live"]
# IODA internet-outage events (optional layer, keyless): country-precision.
ioda-live = ["dep:source-ioda", "source-ioda/live"]
# Bluesky Jetstream chatter volume (optional layer, keyless): aggregate-only,
# never individual posts (docs/SAFETY_AND_PRIVACY.md).
bluesky-live = ["dep:source-bluesky", "source-bluesky/live"]
# Telegram public-channel chatter volume (optional layer): aggregate-only,
# same posture as Bluesky. Needs a one-time interactive login
# (`cargo run -p source-telegram --features live --example login_setup`)
# before it activates; without that it stays gracefully "off", same as ACLED
# without credentials.
telegram-live = ["dep:source-telegram", "source-telegram/live"]
# Gemini-written "Daily Events" digests (needs GEMINI_API_KEY). Unlike the
# source features this one cannot make `daily-digest` optional: the page, the
# storage cache, and the day picker are built from its types either way.
# The feature only adds the network half, so a build without it still shows
# every previously cached digest.
gemini-live = ["daily-digest/live"]
# In-app video playback: an embedded platform webview parented into the
# eframe window (see src/video.rs). Windows-only in practice — `wry` is
# declared under `[target.'cfg(windows)'.dependencies]` below, so enabling
# this feature on Linux/macOS is a no-op that compiles the stub player.
# That is deliberate: CI's ubuntu leg has no webkit2gtk-4.1 dev packages.
video-embed = ["dep:wry"]
# On-demand, place-scoped media lookup (see src/media_page.rs). Shaped like
# `gemini-live`, not like the source features: `media-search` is not optional,
# because the page and its types are built either way — the feature adds only
# the network half, so a build without it shows an honest "search unavailable".
media-live = ["media-search/live"]

[dependencies]
analytics.workspace = true
anyhow.workspace = true
chrono.workspace = true
core-types.workspace = true
daily-digest.workspace = true
directories.workspace = true
dotenvy.workspace = true
eframe.workspace = true
egui.workspace = true
futures-util.workspace = true
geo-utils.workspace = true
media-search.workspace = true
renderer.workspace = true
serde.workspace = true
serde_json.workspace = true
source-acled = { workspace = true, optional = true }
source-bluesky = { workspace = true, optional = true }
source-gdelt.workspace = true
source-ioda = { workspace = true, optional = true }
source-noaa = { workspace = true, optional = true }
source-telegram = { workspace = true, optional = true }
storage.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# wry only builds cleanly where a system webview is a given. On Windows that
# is WebView2 (preinstalled on Win11); on Linux it would need webkit2gtk-4.1
# dev packages, which CI's ubuntu leg has not got — hence the target gate
# rather than a plain optional dependency. All call sites are
# `#[cfg(all(target_os = "windows", feature = "video-embed"))]`.
[target.'cfg(windows)'.dependencies]
wry = { workspace = true, optional = true }

[dev-dependencies]
source-fixtures.workspace = true
tempfile = "3"

[lints]
workspace = true
