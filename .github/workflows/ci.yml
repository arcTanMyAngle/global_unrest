name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary desktop target; Ubuntu keeps the M4
        # (Dockerized services) path honest. All tests are headless.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the actual version; this installs rustup glue.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The bundled DuckDB/SQLite C and C++ builds dominate cold CI time;
      # rust-cache makes warm runs tolerable.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # M5 added acled-live/noaa-live as cargo features on the desktop app and
  # the worker binary (ioda-live, bluesky-live, and telegram-live joined
  # later, same shape). One OS is enough here — the feature code itself
  # isn't OS-specific, only the bundled-DuckDB build in `check` needs the
  # Windows/Ubuntu split. Each feature solo plus the full union, not every
  # subset — enough to catch solo-feature and cross-feature breakage without
  # the combinatorial blowup of all subsets.
  #
  # Note: the desktop app enables all of these by default, so `check` above
  # already compiles the union; this job is what covers each feature *alone*
  # and the worker binary, whose features stay opt-in.
  #
  # `gemini-live` and `media-live` are package-qualified because they exist
  # only on the desktop app — the worker has neither a Daily Events page nor
  # a Media page. The solo entries all leave them off, which is what compiles
  # the stub `api` modules in `apps/global-signal-desktop/src/digest.rs` and
  # `src/media.rs`.
  #
  # `video-embed` is desktop-only too, and on ubuntu it is a deliberate
  # no-op: `wry` sits under `[target.'cfg(windows)'.dependencies]`, so this
  # leg compiles the stub player. Its purpose here is to catch the opposite
  # mistake — a `#[cfg]` that leaves `video.rs` with dead code when the
  # webview is absent, which `-D warnings` then fails on.
  feature-matrix:
    strategy:
      fail-fast: false
      matrix:
        features:
          [
            "acled-live",
            "noaa-live",
            "ioda-live",
            "bluesky-live",
            "telegram-live",
            "global-signal-desktop/gemini-live",
            "global-signal-desktop/media-live",
            "global-signal-desktop/video-embed",
            "acled-live,noaa-live,ioda-live,bluesky-live,telegram-live,global-signal-desktop/gemini-live,global-signal-desktop/media-live,global-signal-desktop/video-embed",
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.features }}
      - name: Clippy (${{ matrix.features }})
        run: |
          cargo clippy -p global-signal-desktop -p workers \
            --no-default-features --features "${{ matrix.features }}" \
            --all-targets -- -D warnings
      - name: Test (${{ matrix.features }})
        run: |
          cargo test -p global-signal-desktop -p workers \
            --no-default-features --features "${{ matrix.features }}"

  # `analytics` has criterion benches (benches/scoring.rs) but no wall-clock
  # performance floor here: this runner has no stable perf baseline and no
  # GPU, so a timing threshold would flake and get ignored. This job is a
  # compile-and-smoke gate instead — it fails if the bench harness stops
  # compiling or a bench itself panics, not on how long it takes.
  # `[lib] bench = false` in crates/analytics/Cargo.toml is what lets the
  # package-level `cargo bench -p analytics` work at all: without it, the
  # lib's own (empty) libtest bench target runs first and rejects criterion's
  # `--quick` flag before `scoring` ever starts. Do not add `--bench scoring`
  # back — that reintroduces the same failure.
  analytics-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bench smoke (analytics)
        run: cargo bench -p analytics -- --quick

  # source-acled's `live` feature carries its own mock-OAuth-server suite
  # (tests/live_mock.rs) — real credentials are never needed for this.
  acled-live-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: source-acled live mock suite
        run: cargo test -p source-acled --features live

  # daily-digest's `live` feature carries the Gemini mock-server suite
  # (tests/live_mock.rs): header auth, the schema travelling through the field
  # that actually enforces it, refusals, rate limits, and the assertion that
  # withheld sources reach the prompt as counts but never as rows. No API key
  # is ever needed — the tests point the client at a local socket.
  gemini-live-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: daily-digest live mock suite
        run: cargo test -p daily-digest --features live

  # media-search's `live` feature carries its own mock-server suite
  # (tests/live_mock.rs): request shape per provider, response parsing, the
  # moderation-label filter, and the per-provider failure reporting that keeps
  # one throttled API from reading as "nothing happened here". Local socket
  # only — no network, no credentials.
  media-search-live-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: media-search live mock suite
        run: cargo test -p media-search --features live

  # source-bluesky's `live` feature carries its own mock-Jetstream-server
  # suite (tests/live_mock.rs): a local WebSocket server feeds the real
  # spawn_stream/fetch path scanned/matched/malformed frames and asserts a
  # window stays pending until it completes. No real network, no keys — the
  # firehose is keyless anyway, but the socket itself is still local-only.
  bluesky-live-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: source-bluesky live mock suite
        run: cargo test -p source-bluesky --features live

  # source-noaa's `live` feature carries its own mock-HTTP-server suite
  # (tests/live_mock.rs): query params, GeoJSON `features` parsing, the
  # empty/missing/non-array `features` cases, and 429 mapping — the same
  # local raw-TcpListener HTTP mock pattern as source-acled, minus the OAuth
  # leg since api.weather.gov is keyless. No real network.
  noaa-live-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: source-noaa live mock suite
        run: cargo test -p source-noaa --features live

  # source-ioda's `live` feature carries its own mock-HTTP-server suite
  # (tests/live_mock.rs): country/window/CODF query params, `data` parsing,
  # empty/missing/non-array/error response cases, and 429 mapping — the same
  # local raw-TcpListener HTTP mock pattern as source-noaa. No real network.
  ioda-live-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: source-ioda live mock suite
        run: cargo test -p source-ioda --features live

  # Closes the M4 verification gap: `docker compose up` was written but
  # never run locally (no docker CLI on the dev machine). Runs fixtures-only
  # (LES_ONLINE=0) so it needs no network or credentials.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      # The one combination the worker must refuse: no live ingest and no
      # fixture seed is a process that would publish nothing, forever.
      - name: Reject LES_ONLINE=0 with LES_SEED_FIXTURES=0
        env:
          LES_ONLINE: "0"
          LES_SEED_FIXTURES: "0"
        run: |
          if docker compose run --rm --no-deps worker; then
            echo "worker started with nothing to ingest and nothing to publish"
            exit 1
          fi
      - name: Start stack (fixtures only)
        run: docker compose up -d
        env:
          LES_ONLINE: "0"
      - name: Wait for api /health and assert events > 0
        run: |
          status=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health -o /tmp/health.json; then
              status="ok"
              break
            fi
            echo "waiting for api ($i/30)..."
            sleep 5
          done
          if [ -z "$status" ]; then
            echo "api never became healthy"
            exit 1
          fi
          cat /tmp/health.json
          events=$(jq '.snapshot.events' /tmp/health.json)
          echo "snapshot events=$events"
          if [ "$events" -lt 1 ]; then
            echo "expected at least one event from the fixtures-only stack"
            exit 1
          fi
      - name: Logs (always, for debugging)
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
