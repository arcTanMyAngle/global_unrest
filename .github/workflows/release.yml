name: Release

# Tag-driven: push a `v*` tag (e.g. `v0.7.0`, matching the CHANGELOG entry
# and workspace.package.version) to build desktop binaries for every
# platform and push worker/api images to GHCR. Nothing here runs on a
# normal branch push — see ci.yml for that.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # A `v*` push trigger accepts any tag shape and does not by itself mean
  # the tag matches the crate version, has a CHANGELOG entry, or was cut
  # from main. This job makes those three things a hard requirement before
  # any build or publish work starts.
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate tag against workspace version, CHANGELOG, and main
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a semver 'vX.Y.Z' tag."
            exit 1
          fi
          version="${tag#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$version" != "$cargo_version" ]]; then
            echo "::error::Tag version $version does not match workspace.package.version $cargo_version."
            exit 1
          fi
          if ! grep -qE "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' entry."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop-binaries:
    needs: validate-tag
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: global-signal-desktop.exe
            asset: live-earth-signals-desktop-windows-x86_64.zip
          - os: ubuntu-latest
            bin: global-signal-desktop
            asset: live-earth-signals-desktop-linux-x86_64.tar.gz
          - os: macos-latest
            bin: global-signal-desktop
            asset: live-earth-signals-desktop-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned to a specific commit on the moving `stable` branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (release)
        run: cargo build --release -p global-signal-desktop
# Fixtures remain useful for regression and service troubleshooting, so the
# release package keeps them. The desktop binary itself is live-data-only.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/${{ matrix.bin }} dist/
          Copy-Item -Recurse fixtures dist/fixtures
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/
          cp -r fixtures dist/fixtures
          tar -czf ${{ matrix.asset }} -C dist .
      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path ${{ matrix.asset }}).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii -NoNewline ${{ matrix.asset }}.sha256
      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        # shasum (not sha256sum) is the one guaranteed present on both the
        # macOS and Linux GitHub-hosted runner images.
        run: shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  ghcr-images:
    needs: [validate-tag, desktop-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [workers, api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/global-unrest-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [validate-tag, desktop-binaries, ghcr-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # CHANGELOG.md is hand-maintained per tag; this just points
          # release-readers at the tagged copy rather than duplicating the
          # text or linking a version that will drift once main moves on.
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

            Worker/api images (also tagged with the `major.minor` shorthand and `latest`): `ghcr.io/${{ github.repository_owner }}/global-unrest-workers:${{ needs.validate-tag.outputs.version }}`, `ghcr.io/${{ github.repository_owner }}/global-unrest-api:${{ needs.validate-tag.outputs.version }}`

            Each desktop archive ships with a `.sha256` checksum file and a
            build provenance attestation verifiable with
            `gh attestation verify <file> -R ${{ github.repository }}`.
          files: artifacts/*/*
          generate_release_notes: true
